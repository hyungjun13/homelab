services:
  npm:
    container_name: npm
    image: jc21/nginx-proxy-manager:2.17.0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      TZ: "America/Chicago"
    volumes:
      - /tank/appdata/npm/data:/data
      - /tank/appdata/npm/letsencrypt:/etc/letsencrypt
