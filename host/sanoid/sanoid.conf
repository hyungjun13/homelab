# Local ZFS snapshot policy. Installed to /etc/sanoid/sanoid.conf by install.sh.
# Sanoid only creates and prunes its own autosnap_* snapshots; the nightly
# tank@restic snapshot from host/restic is left alone.

[tank]
  use_template = production
  recursive = yes

[template_production]
  frequently = 0
  hourly = 24
  daily = 30
  monthly = 6
  autosnap = yes
  autoprune = yes
